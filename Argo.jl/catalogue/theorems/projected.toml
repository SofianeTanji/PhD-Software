# Theorem declarations for the projected family.
[[theorems]]
bound = "proximal_gradient_gmd_gap_bound"
citation = "Karimi-Nutini-Schmidt 2016 LNCS 9851, Thm. 5 specialized to indicator/projection term"
id = "projected_gradient_gmd_objective_gap_linear"
initial_bound = "objective_gap"
method = "projected_gradient"
name = "Projected Gradient (Gradient-Mapping Dominance)"
output = "last"
quantity = "objective_gap"
tightness = "known_upper_bound"

    [theorems.notes]
    property_interpreted_for_composite_objective = true
    proximal_slot_is_indicator_projection = true

    [theorems.parameter_rules]
    rate_factor = "pl_linear_rate_factor"
    step_size = "proximal_gradient_step"

    [[theorems.roles]]
    name = "f"
    properties = ["smooth", "gradient_mapping_dominance"]

        [[theorems.roles.oracles]]
        exactness = "exact"
        name = "gradient"
    [[theorems.roles]]
    name = "g"
    properties = ["convex", "compact_domain"]

        [[theorems.roles.oracles]]
        exactness = "exact"
        name = "prox"
