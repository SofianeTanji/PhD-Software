[build-system]
requires = ["setuptools>=77", "Cython>=3", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "snacks"
version = "0.1.0"
description = "Kernel SVM via Nyström approximation and RASSG-r optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "numba>=0.65.1",
]

[project.optional-dependencies]
repro = [
    "libsvmdata>=0.5",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "zensical",
    "ruff>=0.15.16",
]
